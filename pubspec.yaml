name: proximity_alarm
description: A destination-aware alarm for Android journeys, with an iOS-ready Flutter UI.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.3
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.5.0
  latlong2: ^0.9.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
